<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ເຂົ້າສູ່ເວັບໄຊໂຮງຮຽນ</title>
  <meta name="theme-color" content="#1565C0">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-auto gate-page">
  <main class="gate-wrap">
    <section class="gate-card">
      <div class="gate-brand">
        <img class="gate-logo" src="./icons/icon-192.png" alt="">
        <div>
          <h1 class="gate-title" data-i18n="gate.title">ເຂົ້າສູ່ເວັບໄຊໂຮງຮຽນ</h1>
          <p class="gate-subtitle" data-i18n="gate.subtitle">ກະລຸນາໃສ່ຊື່ຜູ້ໃຊ້ ແລະລະຫັດຜ່ານເພື່ອເບິ່ງຂໍ້ມູນຂອງໂຮງຮຽນ</p>
        </div>
      </div>

      <form class="gate-form" id="gateForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="gateUsername" data-i18n="login.username">ຊື່ຜູ້ໃຊ້</label>
          <input class="form-input" id="gateUsername" type="text" autocomplete="username"
                 placeholder="ໃສ່ຊື່ຜູ້ໃຊ້" data-i18n-placeholder="gate.userPh">
        </div>

        <div class="form-group">
          <label class="form-label" for="gatePassword" data-i18n="login.password">ລະຫັດຜ່ານ</label>
          <div class="password-field">
            <input class="form-input" id="gatePassword" type="password" autocomplete="current-password"
                   placeholder="ໃສ່ລະຫັດຜ່ານ" data-i18n-placeholder="gate.passPh">
            <button class="password-toggle" type="button" data-password-toggle="#gatePassword"
                    data-i18n-title="gate.showPassword" aria-label="Show password" aria-pressed="false">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </div>
        </div>

        <div class="login-error hidden" id="gateError" data-i18n="gate.invalid">ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ!</div>

        <button class="btn btn-primary gate-submit" type="submit">
          <span class="material-symbols-rounded">login</span>
          <span data-i18n="login.login">ເຂົ້າສູ່ລະບົບ</span>
        </button>
      </form>

      <button class="gate-lang" id="gateLangBtn" type="button" data-i18n-title="header.lang">
        <span class="material-symbols-rounded">language</span>
        <span id="gateLangLabel">ລາວ</span>
      </button>
    </section>
  </main>

  <script src="js/lang.js"></script>
  <script src="js/gate.js"></script>
</body>
</html>
