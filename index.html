<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ໂຮງຮຽນ ນ້ຳເທີນ2 - ລະບົບຈັດການໂຮງຮຽນ</title>
  <meta name="description" content="ລະບົບຈັດການໂຮງຮຽນ ນ້ຳເທີນ2 - ຂໍ້ມູນຄູ, ນັກຮຽນ, ຕາຕະລາງ, ຄະແນນ">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-auto">
  <div class="app-container">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="school-logo" id="school-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1 9L4 10.63V17.5C4 18.88 7.58 20 12 20C16.42 20 20 18.88 20 17.5V10.63L23 9L12 3M12 5.18L18.66 8.84L12 12.5L5.34 8.84L12 5.18Z"/>
          </svg>
        </div>
        <h1 class="school-name" id="schoolName">ໂຮງຮຽນ ນ້ຳເທີນ2</h1>
        <span class="school-subtitle" id="schoolSubtitle">ລະບົບຈັດການໂຮງຮຽນ</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="material-symbols-rounded">dashboard</span><span>ໜ້າຫຼັກ</span>
        </a>
        <a class="nav-item" data-page="teachers">
          <span class="material-symbols-rounded">school</span><span>ຄູອາຈານ</span>
        </a>
        <a class="nav-item" data-page="students">
          <span class="material-symbols-rounded">groups</span><span>ນັກຮຽນ</span>
        </a>
        <a class="nav-item" data-page="scores">
          <span class="material-symbols-rounded">grade</span><span>ຄະແນນ</span>
        </a>
        <a class="nav-item" data-page="schedule">
          <span class="material-symbols-rounded">calendar_month</span><span>ຕາຕະລາງ</span>
        </a>
        <a class="nav-item" data-page="classes">
          <span class="material-symbols-rounded">class</span><span>ຊັ້ນຮຽນ</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sync-status" id="syncStatus">
          <span class="material-symbols-rounded sync-icon" id="syncIcon">cloud_sync</span>
          <span id="lastUpdateTime">ກຳລັງໂຫຼດ...</span>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN WRAPPER ============ -->
    <div class="main-wrapper">

      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle">
            <span class="material-symbols-rounded">menu</span>
          </button>
          <h2 class="header-title" id="headerTitle">ໜ້າຫຼັກ</h2>
        </div>
        <div class="header-right">
          <button class="refresh-btn" id="refreshBtn" title="ໂຫຼດຂໍ້ມູນໃໝ່ຈາກ Google Sheet">
            <span class="material-symbols-rounded">refresh</span>
          </button>
          <button class="theme-cycle-btn" id="themeToggleBtn" title="ສະຫຼັບໂໝດສີ">
            <span class="material-symbols-rounded" id="themeIcon">brightness_auto</span>
          </button>

          <!-- ສົກຮຽນ DROPDOWN -->
          <div class="year-dropdown" id="yearDropdown">
            <button class="year-dropdown-btn" id="yearDropdownBtn">
              <span class="material-symbols-rounded">history_edu</span>
              <span id="yearDropdownLabel">ສົກຮຽນ</span>
              <span class="material-symbols-rounded year-chevron" id="yearChevron">expand_more</span>
            </button>
            <div class="year-dropdown-menu" id="yearDropdownMenu">
              <!-- populated by JS -->
            </div>
          </div>

          <button class="login-btn" id="loginBtn">
            <span class="material-symbols-rounded">login</span><span>ເຂົ້າສູ່ລະບົບ</span>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="main-content" id="mainContent">
        <!-- Pages render here dynamically -->
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p>ກຳລັງໂຫຼດຂໍ້ມູນ...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ LOGIN MODAL ============ -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">
          <span class="material-symbols-rounded">lock</span> ເຂົ້າສູ່ລະບົບ
        </h3>
        <button class="modal-close" id="loginModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">ຊື່ຜູ້ໃຊ້</label>
          <input class="form-input" type="text" id="loginUsername" placeholder="ໃສ່ຊື່ຜູ້ໃຊ້" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">ລະຫັດຜ່ານ</label>
          <input class="form-input" type="password" id="loginPassword" placeholder="ໃສ່ລະຫັດຜ່ານ" autocomplete="current-password">
        </div>
        <div id="loginError" class="login-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="loginModalClose2">ຍົກເລີກ</button>
        <button class="btn btn-primary" id="loginSubmit">
          <span class="material-symbols-rounded">login</span> ເຂົ້າສູ່ລະບົບ
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- SCRIPTS -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
