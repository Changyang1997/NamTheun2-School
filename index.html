<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ໂຮງຮຽນ ນ້ຳເທີນ2 - ລະບົບຈັດການໂຮງຮຽນ</title>
  <meta name="description" content="ລະບົບຈັດການໂຮງຮຽນ ນ້ຳເທີນ2 - ຂໍ້ມູນຄູ, ນັກຮຽນ, ຕາຕະລາງ, ຄະແນນ" data-i18n-content="app.description">

  <!-- ENTRY GATE: block the app before any school data is loaded. -->
  <script src="js/gate.js"></script>
  <script>
    if (window.NT2 && NT2.Gate) NT2.Gate.require();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ນ້ຳເທີນ2" data-i18n-content="pwa.short_name">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-auto">
  <div class="app-container">

    <!-- ============ SIDEBAR ============ -->
<aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="school-logo" id="school-logo">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1 9L4 10.63V17.5C4 18.88 7.58 20 12 20C16.42 20 20 18.88 20 17.5V10.63L23 9L12 3M12 5.18L18.66 8.84L12 12.5L5.34 8.84L12 5.18Z"/>
          </svg>
        </div>
        <h1 class="school-name" id="schoolName">ໂຮງຮຽນ ນ້ຳເທີນ2</h1>
        <span class="school-subtitle" id="schoolSubtitle">ລະບົບຈັດການໂຮງຮຽນ</span>
      </div>

      <!-- YEAR DROPDOWN -->
      <div class="year-dropdown sidebar-year" id="yearDropdown">
        <button class="year-dropdown-btn" id="yearDropdownBtn">
          <span class="material-symbols-rounded">history_edu</span>
          <span id="yearDropdownLabel">ສົກຮຽນ</span>
          <span class="material-symbols-rounded year-chevron" id="yearChevron">expand_more</span>
        </button>
        <div class="year-dropdown-menu" id="yearDropdownMenu">
          <!-- populated by JS -->
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="material-symbols-rounded">dashboard</span><span data-i18n="nav.dashboard">ໜ້າຫຼັກ</span>
        </a>
        <a class="nav-item" data-page="teachers">
          <span class="material-symbols-rounded">school</span><span data-i18n="nav.teachers">ຄູອາຈານ</span>
        </a>
        <a class="nav-item" data-page="students">
          <span class="material-symbols-rounded">groups</span><span data-i18n="nav.students">ນັກຮຽນ</span>
        </a>
        <a class="nav-item" data-page="scores">
          <span class="material-symbols-rounded">grade</span><span data-i18n="nav.scores">ຄະແນນ</span>
        </a>
        <a class="nav-item" data-page="attendance">
          <span class="material-symbols-rounded">how_to_reg</span><span data-i18n="nav.attendance">ຕິດຕາມການມາຮຽນ</span>
        </a>
        <a class="nav-item" data-page="schedule">
          <span class="material-symbols-rounded">calendar_month</span><span data-i18n="nav.schedule">ຕາຕະລາງ</span>
        </a>
        <a class="nav-item" data-page="classes">
          <span class="material-symbols-rounded">class</span><span data-i18n="nav.classes">ຊັ້ນຮຽນ</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-actions">
          <button class="install-btn" id="installBtn" title="ຕິດຕັ້ງແອັບ" data-i18n-title="pwa.install">
            <span class="material-symbols-rounded">install_mobile</span>
            <span data-i18n="pwa.install_short">ຕິດຕັ້ງ</span>
          </button>
          <button class="lang-toggle-btn" id="langToggleBtn" title="ປ່ຽນພາສາ" data-i18n-title="header.lang">
            <span id="langLabel">ລາວ</span>
          </button>
          <button class="theme-cycle-btn" id="themeToggleBtn" title="ສະຫຼັບໂໝດສີ" data-i18n-title="header.theme">
            <span class="material-symbols-rounded" id="themeIcon">brightness_auto</span>
          </button>
          <button class="lock-btn" id="gateLockBtn" title="ລັອກໜ້າເວັບ" data-i18n-title="gate.lock">
            <span class="material-symbols-rounded">lock</span>
          </button>
        </div>
        <button class="login-btn" id="loginBtn">
          <span class="material-symbols-rounded">login</span><span data-i18n="login.login">ເຂົ້າສູ່ລະບົບ</span>
        </button>
        <div class="sync-status" id="syncStatus">
          <span class="material-symbols-rounded sync-icon" id="syncIcon">cloud_sync</span>
          <span id="lastUpdateTime" data-i18n="sync.loading">ກຳລັງໂຫຼດ...</span>
        </div>
        <div class="copyright" data-i18n="footer.copyright">© 2026 ນັກພັດທະນາ ຈ່າງຢ່າງ ແດນສະຫວັນ</div>
      </div>
    </aside>

    <!-- SIDEBAR OVERLAY (mobile) — inside app-container so it dims the page but never covers the sidebar menu -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============ MAIN WRAPPER ============ -->
    <div class="main-wrapper">

      <!-- TOP HEADER -->
      <header class="top-header" id="topHeader"></header>

      <!-- MAIN CONTENT -->
      <main class="main-content" id="mainContent">
        <!-- Pages render here dynamically -->
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p data-i18n="loading">ກຳລັງໂຫຼດຂໍ້ມູນ...</p>
        </div>
      </main>
    </div>
  </div>

  <!-- MOBILE MENU TOGGLE -->
  <button class="mobile-menu-btn" id="mobileMenuBtn">
    <span class="material-symbols-rounded">menu</span>
  </button>

  <!-- PWA INSTALL (mobile, visible next to the menu button) -->
  <button class="mobile-install-btn" id="mobileInstallBtn" title="ຕິດຕັ້ງແອັບ" data-i18n-title="pwa.install">
    <span class="material-symbols-rounded">install_mobile</span>
  </button>

  <!-- ============ LOGIN MODAL ============ -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">
          <span class="material-symbols-rounded">lock</span> <span data-i18n="login.login">ເຂົ້າສູ່ລະບົບ</span>
        </h3>
        <button class="modal-close" id="loginModalClose" data-i18n-title="login.cancel">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" data-i18n="login.username">ຊື່ຜູ້ໃຊ້</label>
          <input class="form-input" type="text" id="loginUsername" placeholder="ໃສ່ຊື່ຜູ້ໃຊ້" autocomplete="username" data-i18n-placeholder="login.userPh">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="login.password">ລະຫັດຜ່ານ</label>
          <div class="password-field">
            <input class="form-input" type="password" id="loginPassword" placeholder="ໃສ່ລະຫັດຜ່ານ" autocomplete="current-password" data-i18n-placeholder="login.passPh">
            <button class="password-toggle" type="button" data-password-toggle="#loginPassword"
                    data-i18n-title="gate.showPassword" aria-label="Show password" aria-pressed="false">
              <span class="material-symbols-rounded">visibility</span>
            </button>
          </div>
        </div>
        <div id="loginError" class="login-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="loginModalClose2" data-i18n="login.cancel">ຍົກເລີກ</button>
        <button class="btn btn-primary" id="loginSubmit">
          <span class="material-symbols-rounded">login</span> <span data-i18n="login.login">ເຂົ້າສູ່ລະບົບ</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- SCRIPTS -->
  <script src="js/lang.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
